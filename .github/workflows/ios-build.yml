name: Build iOS IPA (ARM64 Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA (ARM64 Unsigned)
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ermaymuhasebe-mobil/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ermaymuhasebe-mobil
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: ⚙️ Setup CocoaPods & Fastlane
        working-directory: ermaymuhasebe-mobil
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS App (ARM64 Generic Device)
        working-directory: ermaymuhasebe-mobil/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="BAWSAQ.xcworkspace"
            SCHEME="BAWSAQ"
          else
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          fi
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

      - name: 📦 Package into IPA (Payload format)
        working-directory: ermaymuhasebe-mobil/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Packaging App: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -y BAWSAQ.ipa Payload
          mkdir -p ../../output
          cp BAWSAQ.ipa ../../output/

      - name: 🚀 Upload BAWSAQ.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAWSAQ-iOS-IPA
          path: output/BAWSAQ.ipa
          retention-days: 7
