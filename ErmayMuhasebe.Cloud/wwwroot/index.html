<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ErmayMuhasebe.Cloud</title>
    <base href="/" />

    <script>
        // --- FORCE UNREGISTER SERVICE WORKER & CLEAR CACHE ---
        (function () {
            try {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function (registrations) {
                        for (var i = 0; i < registrations.length; i++) {
                            registrations[i].unregister();
                            console.log('SW Unregistered.');
                        }
                    });
                }
                if ('caches' in window) {
                    caches.keys().then(function (names) {
                        for (var i = 0; i < names.length; i++) {
                            caches.delete(names[i]);
                            console.log('Cache Cleared: ' + names[i]);
                        }
                    });
                }
            } catch (e) {}
        })();

        // --- ULTRA-SAFE CONSOLE FILTER ---
        (function () {
            try {
                var noise = ['unsupported syscall', 'mlock', 'munlock'];
                
                var filter = function(args) {
                    try {
                        var str = Array.prototype.slice.call(args).join(' ').toLowerCase();
                        for (var i = 0; i < noise.length; i++) {
                            if (str.indexOf(noise[i]) !== -1) return true;
                        }
                    } catch(e) {}
                    return false;
                };

                var wrap = function(name) {
                    try {
                        var original = console[name];
                        if (typeof original !== 'function') return;
                        
                        // Check if property is writable/configurable to avoid crashes in strict/frozen envs
                        var desc = Object.getOwnPropertyDescriptor(console, name);
                        if (desc && desc.configurable === false) return;

                        console[name] = function() {
                            if (filter(arguments)) return;
                            original.apply(console, arguments);
                        };
                    } catch(e) {
                         // Fail silently to avoid breaking the app boot
                    }
                };

                wrap('log');
                wrap('warn');
                wrap('error');
                wrap('info');

                // Handle Emscripten printErr
                window.Module = window.Module || {};
                window.Module.printErr = function(text) {
                    if (text && typeof text === 'string' && noise.some(function(n) { return text.indexOf(n) !== -1; })) return;
                    if (typeof console.warn === 'function') console.warn(text);
                };
            } catch(e) {
                // Global safety catch
            }
        })();
    </script>

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css?v=3.0.5" rel="stylesheet" />
    <link href="css/app_premium.css?v=3.0.5" rel="stylesheet" />
    <link href="ErmayMuhasebe.Cloud.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background: #0c0c1e; color: white; font-family: 'Inter', sans-serif;">
            <div style="position:relative; width:40px; height:40px; border: 4px solid rgba(59, 130, 246, 0.1); border-top: 4px solid #3b82f6; border-radius:50%; animation: spin 1s linear infinite;"></div>
            <p style="opacity:0.5; font-size:12px; margin-top:20px;">Sistem Yükleniyor...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none; background: #900; color: white; padding: 10px; position: fixed; bottom: 0; width: 100%; z-index: 9999;">
        Bir hata oluştu. Lütfen sayfayı yenileyin.
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { margin: 0; }
    </style>

    <script src="js/cryptoHelper.js?v=8.00"></script>
    <script src="js/ermay_core.js?v=3.0.5"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                return `${defaultUri}?v=3.0.1`;
            }
        });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=8.00"></script>
</body>
