<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ermay Muhasebe - Ultra Premium 30 PDF Tasarım</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --p: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            padding: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
        }

        header h1 {
            font-family: 'Outfit';
            font-size: 4rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        header p {
            font-size: 1.4rem;
            color: #94a3b8;
            max-width: 800px;
            margin: 0 auto;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 50px;
        }

        .item {
            background: var(--card);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .item:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--p);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
        }

        .mockup-container {
            height: 620px;
            padding: 25px;
            background: #000;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .pdf-page {
            width: 100%;
            height: 100%;
            background: white;
            color: #1e293b;
            border-radius: 4px;
            padding: 30px;
            position: relative;
            overflow: auto;
        }

        .info {
            padding: 30px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .info h3 {
            font-family: 'Outfit';
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .info p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .apply-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--p);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .apply-btn:hover {
            background: #4f46e5;
            transform: scale(0.98);
        }

        /* --- STYLE MIXINS --- */
        .pdf-stripe {
            border-top: 12px solid #635bff;
        }

        .pdf-dark {
            background: #000 !important;
            color: #fff !important;
        }

        .pdf-glass {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 40px !important;
        }

        .glass-inner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            height: 100%;
            border-radius: 20px;
            padding: 25px;
        }

        .pdf-apple {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        }

        .pdf-swiss {
            font-family: 'Inter';
            font-weight: 900;
            text-transform: uppercase;
        }

        .badge-p {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 9px;
            font-weight: 700;
            display: inline-block;
            margin-right: 5px;
        }

        .b-blue {
            background: #e0e7ff;
            color: #4338ca;
        }

        .b-green {
            background: #dcfce7;
            color: #15803d;
        }

        .b-red {
            background: #fee2e2;
            color: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            font-size: 10px;
            padding: 12px 8px;
            border-bottom: 2px solid #eee;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 11px;
        }

        .detay {
            font-size: 9px;
            color: #94a3b8;
            padding-left: 20px !important;
            font-style: italic;
        }
    </style>
</head>

<body>

    <header>
        <h1>The Elite 30 Collection</h1>
        <p>Ermay Muhasebe için dünya standartlarında, ultra-modern ve seçkin 30 farklı PDF ekstre tasarımı. Lütfen her
            bir konseptin ruhunu ve detaylarını inceleyin.</p>
    </header>

    <div class="catalog" id="root">
        <!-- JS TO INJECT 30 ITEMS -->
    </div>

    <script>
        const collection = [
            { id: 1, name: "Stripe Clean", desc: "Silikon Vadisi estetiği. Aşırı temiz, indigo vurgulu ve kusursuz tipografi.", class: "pdf-stripe" },
            { id: 2, name: "Midnight Onyx", desc: "Tamamen siyah, derinlikli gölgeler ve neon mavi bakiye kartları.", class: "pdf-dark" },
            { id: 3, name: "Apple Card Minimal", desc: "San Francisco fontu, oval hatlar ve harcama kategorilerine göre renkli ikonlar.", class: "pdf-apple" },
            { id: 4, name: "Swiss Modernism", desc: "900 kalınlıkta fontlar, geometrik ızgara düzeni ve siyah-beyaz zıtlığı.", class: "pdf-swiss" },
            { id: 5, name: "Arctic Glass", desc: "Buzlu cam efekti, arka planda canlı gradyanlar ve yarı saydam tablolar.", class: "pdf-glass" },
            { id: 6, name: "Revolut Velvet", desc: "Mat lacivert zemin, pastel pembe detaylar ve dashboard tarzı özet.", class: "pdf-dark" },
            { id: 7, name: "Executive Heritage", desc: "Playfair Display fontu, fildişi zemin ve altın yaldızlı detaylar.", class: "" },
            { id: 8, name: "Future Tech (Grid)", desc: "Mühendislik blueprint tarzı, ince kareli zemin ve teknik veriler.", class: "" },
            { id: 9, name: "Zen Harmony", desc: "Doğal bej tonları, bambu yeşili vurgular ve maksimum beyaz boşluk.", class: "" },
            { id: 10, name: "Brutalist Bold", class: "pdf-swiss", desc: "Devasa başlıklar, 4px kalınlığında sert çizgiler ve endüstriyel duruş." },
            { id: 11, name: "Material Flow", desc: "Katmanlı gölgeler, z-index derinliği ve canlı Google paletleri.", class: "" },
            { id: 12, name: "Oled Stealth", desc: "Tam siyah zemin, sadece bakiye kısmında parlak kırmızı vurgu.", class: "pdf-dark" },
            { id: 13, name: "Nordic Frost", desc: "Aşırı açık mavi tonları, ince kıl çizgiler ve ferahlık.", class: "" },
            { id: 14, name: "Corporate Gold", desc: "Koyu lacivert, mühür efektli header ve resmi evrak ciddiyeti.", class: "" },
            { id: 15, name: "Neo-Brutalism", desc: "Canlı sarı zemin üzerine siyah kalın hatlar ve pop-art tarzı.", class: "" },
            { id: 16, name: "Magazine Editorial", desc: "Moda dergisi mizanpajı, asimetrik veri dizilimi ve şıklık.", class: "" },
            { id: 17, name: "Skyline Blueprint", desc: "Mimari çizim estetiği, dikey başlık alanları ve cetvel detayları.", class: "" },
            { id: 18, name: "Sunset Horizon", desc: "Turuncu-mor geçişli headerlar ve enerji veren finansal özetler.", class: "" },
            { id: 19, name: "Ivory Silk", desc: "İpeksi dokulu arka plan, serif fontlar ve butik hissiyat.", class: "" },
            { id: 20, name: "Cyber Matrix", desc: "Terminal yeşili veri akışı, monospaced fontlar ve hacker estetiği.", class: "pdf-dark" },
            { id: 21, name: "Glass Dark", desc: "Koyu cam efekti, arkada parlayan ışık süzmeleri ve beyaz metinler.", class: "pdf-dark" },
            { id: 22, name: "Emerald Wealth", desc: "Zengin zümrüt yeşili zemin ve profesyonel beyaz tablolar.", class: "" },
            { id: 23, name: "Compact Power", desc: "Yüksek yoğunluklu veri, tek sayfada maksimum işlem hacmi.", class: "" },
            { id: 24, name: "Playful Pastel", desc: "Eğlenceli renkler, bulut gibi yumuşak formlar ve dost canlısı arayüz.", class: "" },
            { id: 25, name: "Modern Gothic", desc: "Siyah ve kırmızı, dramatik gölgeler ve keskin köşeler.", class: "pdf-dark" },
            { id: 26, name: "Sand & Stone", desc: "Toprak tonları, doğal dokular ve sürdürülebilir finans duruşu.", class: "" },
            { id: 27, name: "Holographic Blue", desc: "Yanar-döner mavi gradyanlar ve şeffaf katmanlar.", class: "" },
            { id: 28, name: "Blueprint v2", desc: "Noktalı teknik zemin, mavi mürekkep rengi tablolar.", class: "" },
            { id: 29, name: "Industrial Steel", desc: "Fırçalanmış metal efekti, sert gri tonlar ve perçin detayları.", class: "" },
            { id: 30, name: "Zen Minimal v2", desc: "Tamamen boşluğa odaklanmış, sadece en kritik verilerin olduğu tasarım.", class: "" }
        ];

        const root = document.getElementById('root');
        collection.forEach(s => {
            const card = document.createElement('div');
            card.className = 'item';
            card.onclick = () => alert("Stil ID: " + s.id + " uygulanıyor...");

            let pdfContent = `
                <div class="pdf-page ${s.class}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px">
                        <h1 style="font-size:24px; font-family:'Outfit'">ERMAY</h1>
                        <span style="font-size:10px; color:#64748b">25.02.2026 // 15:45</span>
                    </div>
                    <h2 style="font-size:18px; margin-bottom:10px">${s.name} Edition</h2>
                    <div style="background:#f8fafc; padding:20px; border-radius:15px; margin-bottom:20px; display:grid; grid-template-columns:1fr 1fr">
                        <div>
                            <p style="font-size:9px; color:#64748b">Cari Ünvan</p>
                            <p style="font-weight:700">YAĞMUR PERDE A.Ş.</p>
                        </div>
                        <div style="text-align:right">
                            <p style="font-size:9px; color:#64748b">Güncel Bakiye</p>
                            <p style="font-weight:900; color:#ef4444; font-size:18px">₺329.444,00</p>
                        </div>
                    </div>
                    <table>
                        <thead><tr><th>Tarih</th><th>İşlem</th><th>Borç</th><th>Alacak</th></tr></thead>
                        <tbody>
                            <tr><td>07.10</td><td><span class="badge-p b-blue">SATIŞ</span> Fatura:122</td><td>1.200,00</td><td>-</td></tr>
                            <tr><td colspan="4" class="detay">- 10 Adet Özel Tasarım Kumaş (120,00 TL)</td></tr>
                            <tr><td>12.10</td><td><span class="badge-p b-green">ÖDEME</span> Tahsilat</td><td>-</td><td>500,00</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            if (s.class === "pdf-glass") {
                pdfContent = `
                    <div class="pdf-page ${s.class}">
                        <div class="glass-inner">
                            <h2 style="font-family:'Outfit'; color:#6366f1">GLASSMORPHISM</h2>
                            <p style="font-size:9px">Premium Financial Report</p>
                            <div style="height:100px; background:rgba(255,255,255,0.5); border-radius:15px; margin-top:20px; padding:15px">
                                <p style="font-size:20px; font-weight:900">₺329k</p>
                                <p style="font-size:8px">Current Balance</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="mockup-container">${pdfContent}</div>
                <div class="info">
                    <h3>ID: ${s.id} - ${s.name}</h3>
                    <p>${s.desc}</p>
                    <a href="#" class="apply-btn">SEÇ VE UYGULA</a>
                </div>
            `;
            root.appendChild(card);
        });
    </script>
</body>

</html>
